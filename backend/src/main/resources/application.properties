spring.application.name=backend
server.port=8080

# Load local environment properties from the repository root or backend root.
# Both files are git-ignored; OS environment variables still take precedence.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# PostgreSQL database (local for now; change these 3 lines for the shared database)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/incidentdb}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Required for every application run. Supply JWT_SECRET through the process environment or imported .env file.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Frontend addresses allowed to call this API
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# First admin account (created on startup if no admin exists)
app.admin.name=${APP_ADMIN_NAME:Admin}
app.admin.email=${APP_ADMIN_EMAIL:admin@incident.local}
app.admin.password=${APP_ADMIN_PASSWORD:}

# Local simulated email only; comma-separated recipients listed here fail deterministically.
app.notifications.email.simulate-failure-for=${NOTIFICATION_EMAIL_SIMULATE_FAILURE_FOR:}
app.notifications.email.retry-interval-ms=${NOTIFICATION_EMAIL_RETRY_INTERVAL_MS:60000}
app.notifications.email.retry-initial-delay-ms=${NOTIFICATION_EMAIL_RETRY_INITIAL_DELAY_MS:60000}

# SLA monitoring settings; threshold is the elapsed fraction of each duration.
app.sla.approaching-threshold=${SLA_APPROACHING_THRESHOLD:0.8}
app.sla.monitor-interval-ms=${SLA_MONITOR_INTERVAL_MS:60000}
app.sla.monitor-initial-delay-ms=${SLA_MONITOR_INITIAL_DELAY_MS:60000}
app.sla.monitor-batch-size=${SLA_MONITOR_BATCH_SIZE:100}
