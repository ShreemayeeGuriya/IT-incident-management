spring.application.name=backend
server.port=8080

# H2 database stored as a file in backend/data/
spring.datasource.url=jdbc:h2:file:./data/incidentdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT: use the JWT_SECRET environment variable outside development
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789-abcdefghij}
app.jwt.expiration-ms=86400000

# Frontend addresses allowed to call this API
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# First admin account (created on startup if no admin exists)
app.admin.name=Admin
app.admin.email=admin@incident.local
app.admin.password=Admin@12345
